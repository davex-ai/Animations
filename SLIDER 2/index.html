<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            width: 100%;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .slider{
            position: absolute;
            width: 200px;
            height: 250px;
            top: 10%;
            left: calc(50% - 100px);
            transform-style: preserve-3d;
            transform: perspective(1000px);
        }

        .item{
            position: absolute;
            inset: 0 0 0 0;
            transform: translateZ(550px);
        }

        .item img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <div class="banner">
        <div class="slider">
            <div class="item"><img src="../5. ANIMATED-LANDING-PAGE/Gemini_Generated_Image_zftab5zftab5zfta.png" alt=""></div>
        </div>
    </div>
</body>
</html>
