<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE — STOLEN PRINCESS</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body{
            overflow: hidden;
        }

        header{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 100px;
            z-index: 1000;
        }
        
        header .toggle img {
            max-width: 100%;
        }

        header .logo {
            font-weight: 800;
            font-size: 1.5em;
            letter-spacing: 0.1em;
            color: #fff;
            text-decoration: solid;
        }

        header .toggle{
             max-width: 60px;
             cursor: pointer;
        }

        .banner img{
            position: absolute;
            width: 100%;
            height: 100vh;
            object-fit: cover;
            top: 0;
            left: 0;
            z-index: -7;

        }
        .banner{
            position: relative;
            padding: 0 100vh;
        }
        
         .banner .content{
            position: absolute;
            left: 6em;
            top: 20em;
        }

        .content h2{
            text-transform: uppercase;
            font-weight: 400;
            font-size: 2.5em;
            letter-spacing: 0.1em;
            color: #fff;
        }

        .content span{
            font-weight: 800;
        }

        .content p{
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.02em;
            line-height: 1.5;
            color: #fff;
            margin: 15px 0 35px;
            max-width: 550px;
        } 

       .play{
            position: relative;
            display: flex;
            justify-content: space-between;
            align-self: center;
            color: #fff;
            text-transform: uppercase;
            font-weight: 500;
            text-decoration: none;
            letter-spacing: 2px;
            font-size: 1.2em;

        }

        .play img{
            object-fit: scale-down;
            margin-top: -25em;
        }

        .slide{
            position: relative;
            bottom: -50em;
            left: calc(50% - 250px / 2);
            width: 250px;
            height: 150px;
            background: url(slide.png);
            background-size: contain;
            cursor: pointer;
            animation: animate 20s linear infinite;
        }


        @keyframes animate {
            0%, 100%{
                background-position: top;
            }
            45%, 55%{
                background-position: bottom;
            }
            
        }

        .trailer{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10000;
            background: rgba(0 , 0, 0, 0.95);
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
        }
        
        .trailer .active{
            visibility: visible;
            opacity: 1;

        }

        .trailer video{
            min-width: 900px;
            outline: none;
        }

        .trailer .close{
            position: absolute;
            top: 30px;
            right: 30px;
            cursor: pointer;
            filter: invert(1);
            max-width: 32px;
        } 

        @media (max-width: 991px) {
            
        }
    </style>
</head>
<body>
    <header>
        <a href="" class="logo">STOLEN PRINCESS</a>
        <div class="toggle"><img src="toggle.png" alt=""></div>
    </header>
    <div class="banner">
        <img src="bg.png" alt="">
        <div class="content">
            <h2>Put on a <span>Happy</span> face</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem itaque, earum numquam, saepe consequatur delectus, corrupti ad ipsum necessitatibus laborum commodi ipsa ducimus in. Temporibus ipsa omnis beatae adipisci cum!</p>
            <a href="" class="play" onclick="toggle()"><img src="play.png" alt=""> Watch Trailer</a>
        </div>
    </div>
    <div class="slide"></div>
    <div class="trailer">
        <video src="trailer.mp4" controls="true"></video>
        <img src="close.png" alt="" class="close">
    </div>
    <script type="text/javascript">
        function toggle(){
            var trailer = document.querySelector('.trailer') 
            trailer.classList.toggle('active')
        }
    </script>
</body>
</html>
