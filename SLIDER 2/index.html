<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .banner{
            width: 100%;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        .slider{
            position: absolute;
            width: 200px;
            height: 250px;
            top: 10%;
            left: calc(50% - 100px);
            transform-style: preserve-3d;
            transform: perspective(1000px);
            animation: autoRun 10s linear infinite;
        }

        
        @keyframes autoRun {
            from{
                transform: perspective(1000px) rotateX(-16deg) rotateY(0deg);
            }to{
                transform: perspective(1000px) rotateX(-16deg) rotateY(360deg);
            }
        }

        .item{
            position: absolute;
            inset: 0 0 0 0;
            transform: rotateY(calc((var(--position) - 1) * (360 / var(--quantity)) * 1deg)) 
                translateZ(550px);
        }

        .item img{
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: min(1400px, 100vw);
            height: max-content;
            padding-bottom: 100px;
            display: flex ;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
        }

        .author {
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            text-align: right;
            max-width: 200px;
        }
        
        .content h1{
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
            font-size: 16em;
            line-height: 1em;
            color: azure;            
            position: relative;
        }

        .content h1::after{
            
        }

        .content h2{
            font-size: 3em;
        }

        .model{
            background-image: url(download.jpg);
            width: 100%;
            height: 75vh;
            position: absolute;
            bottom: 0;
            left: 0;
            background-size: auto 130%;
            background-repeat: no-repeat;
            background-position: top center;


        }


    </style>
</head>
<body>
    <div class="banner">
        <div class="slider" style="--quantity: 10">
            <div class="item" style="--position: 1;"><img src="../5. ANIMATED-LANDING-PAGE/Gemini_Generated_Image_zftab5zftab5zfta.png" alt=""></div>
            <div class="item" style="--position: 2;"><img src="../5. ANIMATED-LANDING-PAGE/Illustration1.png" alt=""></div>
            <div class="item" style="--position: 3;"><img src="../5. ANIMATED-LANDING-PAGE/Illustration2.png" alt=""></div>
            <div class="item" style="--position: 4;"><img src="../5. ANIMATED-LANDING-PAGE/Illustration3.png" alt=""></div>
            <div class="item" style="--position: 5;"><img src="../5. ANIMATED-LANDING-PAGE/Illustration4.png" alt=""></div>
            <div class="item" style="--position: 6;"><img src="../1. ANIMATION/img1.png" alt=""></div>
            <div class="item" style="--position: 7;"><img src="../1. ANIMATION/img2.png" alt=""></div>
            <div class="item" style="--position: 8;"><img src="../1. ANIMATION/img3.png" alt=""></div>
            <div class="item" style="--position: 9;"><img src="../1. ANIMATION/img4.png" alt=""></div>
            <div class="item" style="--position: 10;"><img src="../5. ANIMATED-LANDING-PAGE/Gemini_Generated_Image_zftab5zftab5zfta.png" alt=""></div>
        </div>
        <div class="content">
             <h1 data-content="CSS ONLY"> CSS ONLY </h1>
            <div class="author">
                 <h2>Daveora</h2>
                 <p><b>Web Design</b></p>
                 <p>Lorem ipsum dolor sit amet.</p>
            </div>
            <div class="model"></div>
        </div>
    </div>
</body>
</html>
