<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVIE </title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        header{
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 100px;
            z-index: 1000;
        }
        
        header .toggle img {
            max-width: 100%;
        }

        header .logo {
            max-width: 120px;
        }

        header .toggle{
             max-width: 60px;
             cursor: pointer;
        }

        .banner{
            position: relative;
            width: 100%;
            min-height: 100vh;
            padding: 0 100vh;
            background: url(bg.png);
             background-position: center;
             object-fit: cover;
            background-size: cover;
         /*    display: flex;
            justify-content: flex-start;
            align-items: center;  */
        }
        
         .banner .content{
            max-width: 550px;
            left: 0;
        }

        .content h2{
            text-transform: uppercase;
            font-weight: 400;
            font-size: 2.5em;
            letter-spacing: 0.1em;
            color: #fff;
        }

        .content span{
            font-weight: 800 ;
        }
        .content p{
            font-size: 1.2em;
            font-weight: 300;
            letter-spacing: 0.02em;
            line-height: 1.5;
            color: #fff;
            margin: 15px 0 35px;
        } 

    </style>
</head>
<body>
    <header>
        <a href="" class="logo">MOVIE</a>
        <div class="toggle"><img src="toggle.png" alt=""></div>
    </header>
    <div class="banner">
        <div class="content">
            <h2>Put on a <span>Happy</span> face</h2>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Exercitationem itaque, earum numquam, saepe consequatur delectus, corrupti ad ipsum necessitatibus laborum commodi ipsa ducimus in. Temporibus ipsa omnis beatae adipisci cum!</p>
            <a href="" class="play"><img src="play.png" alt="">Watch Trailer</a>
        </div>
    </div>
    <div class="trailer">
        <video src=""></video>
        <img src="" alt="" class="close">
    </div>
</body>
</html>
